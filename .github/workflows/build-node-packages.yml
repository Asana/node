name: Build Node-Packages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Node (Standard)"]
    types:
      - completed
    branches:
      - v22.21.1

jobs:
  build-packages:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - platform: linux
            arch: x64
            runs_on: ubuntu-22.04
          - platform: linux
            arch: arm64
            runs_on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs_on }}

    env:
      NODE_VERSION: v22.21.1
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Debug Matrix Values
        run: |
          echo "Matrix platform: ${{ matrix.platform }}"
          echo "Matrix arch: ${{ matrix.arch }}"

      - name: Download Node archive
        run: |
          gh release download node-${{ env.NODE_VERSION }}-release \
            --repo asana/node \
            --pattern "node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}-LATEST.tar.xz"
          mv node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}-LATEST.tar.xz node.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute the Dockerfile
        run: |
          pwd
          docker build -t node22_packages_build -f Dockerfile.Packages .

      - name: Extract resources
        run: |
          docker create --name temp_node_packages_extract node22_packages_build
          docker cp temp_node_packages_extract:/usr/src/node/node_modules $GITHUB_WORKSPACE/node_modules
          docker rm temp_node_packages_extract

      - name: Tar node-packages
        run: |
          mkdir -p ./bcrypt@5.1.0/node_modules
          mkdir -p ./cld@2.9.1/node_modules
          mkdir -p ./unix-dgram@2.0.6/node_modules
          mkdir -p "./@datadog+pprof@5.8.0/node_modules/@datadog"
          mv node_modules/bcrypt ./bcrypt@5.1.0/node_modules/
          mv node_modules/cld ./cld@2.9.1/node_modules/
          mv node_modules/unix-dgram ./unix-dgram@2.0.6/node_modules/
          mv "node_modules/@datadog/pprof" "./@datadog+pprof@5.8.0/node_modules/@datadog/"
          tar --hard-dereference -cvzf packages_${{matrix.arch}}.tar.gz bcrypt@5.1.0 cld@2.9.1 unix-dgram@2.0.6 "@datadog+pprof@5.8.0"

      - name: Upload archive to release
        # Attach the built gyp-package bundle to the same node-${NODE_VERSION}-release
        # release that hosts the corresponding Node binaries.
        #
        # Normally this workflow runs after Build Node via workflow_run, so the
        # release already exists by the time we get here. But workflow_dispatch can
        # fire it independently (release may not yet exist), and the matrix still
        # runs both arms (linux-x64, linux-arm64) in parallel — so both arms can
        # race to create the release. The view-or-create guard with the trailing
        # `|| gh release view` tolerates "already exists" from a losing racer and
        # propagates any other create failure through the final view.
        #
        # `--clobber` makes re-uploads idempotent on asset name collisions by
        # deleting the existing asset before uploading. If the new upload fails
        # after the delete, just re-run the job.
        #
        # `gh release edit --title` after upload keeps the release title
        # deterministically derived from NODE_VERSION, overriding any manual rename
        # in the GitHub UI.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="node-${NODE_VERSION}-release"
          RELEASE_NAME="node-${NODE_VERSION}-LATEST"
          FILE="packages_${{matrix.arch}}.tar.gz"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$RELEASE_NAME" --notes "" --repo "$REPO" \
              || gh release view "$TAG" --repo "$REPO" >/dev/null
          fi
          gh release upload "$TAG" "$FILE" --clobber --repo "$REPO"
          gh release edit "$TAG" --title "$RELEASE_NAME" --repo "$REPO"
